
<!DOCTYPE html>

<html>

<head>

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Spider Web Game</title>

<style>

* {
    box-sizing:border-box;
}

html,body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#020305;

    font-family:Arial,Helvetica,sans-serif;

    color:white;

}

body {

    user-select:none;

}

canvas {

    display:block;

    width:100vw;
    height:100vh;

    background:#070a10;

}


/* =========================================================
   MENU
   ========================================================= */

#menu {

    position:fixed;

    inset:0;

    z-index:20;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(40,50,80,.35),
            rgba(0,0,0,.98)
        );

}

.title {

    width:90%;

    text-align:center;

    font-size:
        clamp(28px,7vw,72px);

    font-weight:900;

    letter-spacing:3px;

    margin-bottom:30px;

    text-shadow:
        0 0 8px white,
        0 0 25px #777;

}

.subtitle {

    margin-bottom:14px;

    font-size:18px;

    opacity:.8;

}

.menuButton {

    width:min(330px,80vw);

    padding:15px;

    margin:7px;

    border-radius:10px;

    border:2px solid white;

    background:
        rgba(20,20,20,.85);

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}

.menuButton:hover {

    transform:scale(1.04);

    background:
        rgba(255,255,255,.12);

}

.green {
    border-color:#55ff55;
}

.yellow {
    border-color:#ffff55;
}

.red {
    border-color:#ff5555;
}

.blue {
    border-color:#5599ff;
}


/* =========================================================
   UI
   ========================================================= */

#gameUI {

    position:fixed;

    inset:0;

    z-index:10;

    pointer-events:none;

}

#topBar {

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    background:
        linear-gradient(
            rgba(0,0,0,.9),
            rgba(0,0,0,0)
        );

}

#score {

    font-size:21px;

    font-weight:bold;

}

#status {

    font-size:14px;

    opacity:.85;

}

#quit {

    pointer-events:auto;

    padding:9px 15px;

    border-radius:8px;

    border:2px solid #ff4444;

    background:
        rgba(60,0,0,.7);

    color:white;

    font-weight:bold;

}

#message {

    position:absolute;

    left:50%;

    top:18%;

    transform:
        translateX(-50%);

    font-size:
        clamp(20px,4vw,40px);

    font-weight:900;

    text-align:center;

    text-shadow:
        0 0 10px black,
        0 0 25px black;

    opacity:0;

}


/* =========================================================
   VIGNETTE
   ========================================================= */

#vignette {

    position:fixed;

    inset:0;

    z-index:9;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.28) 70%,
            rgba(0,0,0,.88) 100%
        );

}


/* ===== COMIC VILLAIN SELECT SCREEN ===== */
#menu{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden;
    background:
      linear-gradient(90deg,rgba(2,4,12,.92),rgba(2,4,12,.48),rgba(2,4,12,.90)),
      linear-gradient(0deg,rgba(0,0,0,.70),rgba(0,0,0,.12)),
      url('spidey.jpg') center/cover no-repeat;
    animation: menuZoom 14s ease-in-out infinite alternate;
}
#menu::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(circle at 50% 42%,rgba(255,255,255,.12),transparent 28%),
      repeating-linear-gradient(0deg,transparent 0 7px,rgba(255,255,255,.035) 8px 9px),
      repeating-linear-gradient(90deg,transparent 0 7px,rgba(255,255,255,.025) 8px 9px);
    mix-blend-mode:screen;
    animation: comicScan 7s linear infinite;
}
#menu::after{
    content:""; position:absolute; inset:-20%; pointer-events:none;
    background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.72) 82%);
}
#menu > *{position:relative;z-index:2}
.title{
    width:92%; text-align:center; font-size:clamp(30px,7vw,76px); font-weight:1000;
    letter-spacing:4px; margin-bottom:18px; color:#fff;
    text-shadow:0 3px 0 #000,0 0 10px #fff,0 0 28px rgba(255,255,255,.65);
    animation:titleFloat 2.6s ease-in-out infinite;
}
.subtitle{
    margin-bottom:18px; font-size:clamp(14px,2vw,20px); font-weight:800;
    letter-spacing:3px; text-transform:uppercase; color:#fff;
    text-shadow:0 2px 5px #000; animation:fadePulse 2s ease-in-out infinite;
}
.menuButton{
    width:min(360px,82vw); padding:16px 20px; margin:7px;
    border-radius:14px; border:2px solid rgba(255,255,255,.85);
    background:linear-gradient(135deg,rgba(0,0,0,.72),rgba(30,30,40,.45));
    color:#fff; font-size:18px; font-weight:900; letter-spacing:1.5px;
    cursor:pointer; backdrop-filter:blur(6px); box-shadow:0 10px 28px rgba(0,0,0,.38);
    transition:transform .18s,box-shadow .18s,background .18s;
    text-shadow:0 2px 4px #000;
}
.menuButton:hover{transform:translateY(-4px) scale(1.035);box-shadow:0 14px 35px rgba(0,0,0,.55)}
.menuButton:active{transform:scale(.97)}
.menuButton.green:hover{background:linear-gradient(135deg,rgba(0,110,45,.78),rgba(20,20,30,.65))}
.menuButton.yellow:hover{background:linear-gradient(135deg,rgba(0,90,180,.78),rgba(20,20,30,.65))}
.menuButton.red:hover{background:linear-gradient(135deg,rgba(125,0,35,.80),rgba(20,20,30,.65))}
.menuButton.blue:hover{background:linear-gradient(135deg,rgba(0,95,75,.82),rgba(20,20,30,.65))}
@keyframes menuZoom{from{transform:scale(1)}to{transform:scale(1.055)}}
@keyframes comicScan{from{transform:translateY(-2%)}to{transform:translateY(2%)}}
@keyframes titleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadePulse{0%,100%{opacity:.72}50%{opacity:1}}

#message{font-weight:1000;letter-spacing:2px;transform:translateX(-50%) scale(1.05);transition:all .15s;text-transform:uppercase;}
#soundToggle{pointer-events:auto;padding:9px 13px;border-radius:8px;border:2px solid rgba(255,255,255,.65);background:rgba(10,10,20,.65);color:#fff;font-weight:bold;cursor:pointer;}
</style>

</head>


<body>


<div id="menu">

    <div class="title">
        CATCH THE USELESS VILLAIN
    </div>

    <div class="subtitle">
        SELECT YOUR VILLAIN
    </div>

    <button class="menuButton green"
    onclick="selectVillain('goblin')">
        GREEN GOBLIN
    </button>

    <button class="menuButton yellow"
    onclick="selectVillain('electro')">
        ELECTRO
    </button>

    <button class="menuButton red"
    onclick="selectVillain('octopus')">
        DOCTOR OCTOPUS
    </button>

    <button class="menuButton blue"
    onclick="selectVillain('lizard')">
        LIZARD
    </button>

</div>


<canvas id="game"></canvas>


<div id="gameUI">

    <div id="topBar">

        <div id="score">
            WEBS: 0
        </div>

        <div id="status">
            READY
        </div>

        <button id="soundToggle" onclick="initAudio(); soundOn=!soundOn; this.innerText=soundOn?"🔊 SOUND":"🔇 MUTED";">🔊 SOUND</button>

        <button id="quit"
        onclick="quitGame()">
            QUIT GAME
        </button>

    </div>

    <div id="message"></div>

</div>


<div id="vignette"></div>


<script>

// ============================================================
// CANVAS
// ============================================================

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W =
window.innerWidth;

let H =
window.innerHeight;


function resize() {

    W =
    window.innerWidth;

    H =
    window.innerHeight;

    canvas.width = W;
    canvas.height = H;

}

window.addEventListener(
    "resize",
    resize
);

resize();


// ============================================================
// GAME
// ============================================================

let gameRunning = false;

let selectedVillain =
"goblin";

let score = 0;

let ws = null;

// ============================================================
// VILLAIN IMAGE ASSETS
// ============================================================
const villainImages = {
    goblin:  {file:"gg.png",       fallbacks:[], image:null, canvas:null, ready:false},
    electro: {file:"electro(1).jpg",  fallbacks:["electro.jpg","electro.png"], image:null, canvas:null, ready:false},
    octopus: {file:"oct.png",      fallbacks:[], image:null, canvas:null, ready:false},
    lizard:  {file:"liz.png",      fallbacks:[], image:null, canvas:null, ready:false}
};

function prepareVillainImage(key){
    const data = villainImages[key];
    if(!data || data.ready) return;
    const img = new Image();
    img.onload = function(){
        try{
            const c=document.createElement('canvas');
            c.width=img.naturalWidth; c.height=img.naturalHeight;
            const x=c.getContext('2d'); x.drawImage(img,0,0);
            const im=x.getImageData(0,0,c.width,c.height);
            const d=im.data, w=c.width, h=c.height;
            const seen=new Uint8Array(w*h), q=[];
            const mode=(key==='octopus')?'black':'checker';
            const bg=(i)=>{
                const r=d[i],g=d[i+1],b=d[i+2];
                if(mode==='black') return Math.max(r,g,b)<42;
                return Math.max(r,g,b)>145 && Math.max(r,g,b)-Math.min(r,g,b)<45;
            };
            function push(px,py){
                if(px<0||py<0||px>=w||py>=h) return;
                const n=py*w+px; if(seen[n]) return; seen[n]=1;
                const i=n*4; if(bg(i)){q.push(n)}
            }
            for(let xx=0;xx<w;xx++){push(xx,0);push(xx,h-1)}
            for(let yy=0;yy<h;yy++){push(0,yy);push(w-1,yy)}
            for(let qi=0;qi<q.length;qi++){
                const n=q[qi], px=n%w, py=(n/w)|0, i=n*4;
                d[i+3]=0;
                push(px+1,py);push(px-1,py);push(px,py+1);push(px,py-1);
            }
            x.putImageData(im,0,0);
            // Crop transparent margins so the supplied villain art fills the scene.
            let minX=w,minY=h,maxX=-1,maxY=-1;
            const dd=im.data;
            for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++){
                if(dd[(yy*w+xx)*4+3]>18){minX=Math.min(minX,xx);maxX=Math.max(maxX,xx);minY=Math.min(minY,yy);maxY=Math.max(maxY,yy)}
            }
            if(maxX>=minX){
                const crop=document.createElement('canvas');
                crop.width=maxX-minX+1; crop.height=maxY-minY+1;
                crop.getContext('2d').drawImage(c,minX,minY,crop.width,crop.height,0,0,crop.width,crop.height);
                data.canvas=crop;
            }else data.canvas=c;
            data.image=img; data.ready=true;
        }catch(e){ data.image=img; data.ready=true; }
    };
    const sources=[data.file,...(data.fallbacks||[])];
    let sourceIndex=0;
    function loadNext(){
        if(sourceIndex>=sources.length){
            console.warn("Villain image could not be loaded:", key, sources);
            data.ready=true;
            return;
        }
        const src=sources[sourceIndex++];
        img.onerror=function(){ loadNext(); };
        img.src=encodeURI(src);
    }
    loadNext();
}
Object.keys(villainImages).forEach(prepareVillainImage);

// ============================================================
// COMIC THEME / DODGE FX
// ============================================================
let dodgeFX=0;
let dodgeFlash=0;
let dodgeStart=0;
let dodgeCount=0;

const villainTheme={
    goblin:{name:'GREEN GOBLIN',accent:'#65ff62',accent2:'#b600ff',msg:'HAHA! MISSED ME!'},
    electro:{name:'ELECTRO',accent:'#4fd8ff',accent2:'#ffe84d',msg:'ZAP! TOO SLOW!'},
    octopus:{name:'DOCTOR OCTOPUS',accent:'#e54bff',accent2:'#b52c35',msg:'NOT SO FAST!'},
    lizard:{name:'LIZARD',accent:'#71e35b',accent2:'#1c9c66',msg:'GRRR! MISSED!'}
};

// Browser-generated sounds: no audio files required.
let audioCtx=null;
let soundOn=true;
function initAudio(){
    if(!audioCtx){
        try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    }
    if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,dur,type='sine',gain=.035,slide=0){
    if(!audioCtx || !soundOn) return;
    const now=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,now);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),now+dur);
    g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(gain,now+.008); g.gain.exponentialRampToValueAtTime(.0001,now+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+dur+.02);
}
function noise(dur=.12,gain=.025){
    if(!audioCtx || !soundOn) return;
    const n=audioCtx.sampleRate*dur, b=audioCtx.createBuffer(1,n,audioCtx.sampleRate), a=b.getChannelData(0);
    for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const src=audioCtx.createBufferSource(), g=audioCtx.createGain(); src.buffer=b;
    g.gain.setValueAtTime(gain,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    src.connect(g);g.connect(audioCtx.destination);src.start();
}
function villainDodgeSound(){
    initAudio();
    if(!audioCtx) return;
    if(selectedVillain==='goblin'){
        tone(260,.08,'sawtooth',.035,420); setTimeout(()=>tone(760,.16,'square',.025,-250),55); noise(.12,.018);
    }else if(selectedVillain==='electro'){
        // Electric crack + high-voltage arc + discharge tail
        tone(75,.045,'sawtooth',.055,1200);
        setTimeout(()=>tone(1250,.055,'square',.045,-180),25);
        setTimeout(()=>tone(620,.12,'sawtooth',.035,420),70);
        noise(.24,.045);
        setTimeout(()=>noise(.12,.025),110);
    }else if(selectedVillain==='octopus'){
        tone(105,.22,'sawtooth',.045,90); setTimeout(()=>tone(190,.20,'triangle',.035,-70),90); noise(.10,.02);
    }else{
        tone(90,.28,'sawtooth',.05,35); setTimeout(()=>tone(62,.24,'sawtooth',.04,-15),80); noise(.16,.022);
    }
}
function webShotSound(){ initAudio(); tone(680,.09,'triangle',.025,280); if(selectedVillain==='electro'){ setTimeout(()=>tone(420,.06,'square',.018,260),35); } }

function drawDodgeFX(t){
    if(dodgeFX<=0) return;
    const p=Math.min(1,(t-dodgeStart)/900), e=1-p;
    const th=villainTheme[selectedVillain]||villainTheme.goblin;
    ctx.save();
    // Motion trails
    for(let i=0;i<12;i++){
        const a=(i/12)*Math.PI*2+t*.002;
        const len=(1-e)*W*.12+W*.025;
        ctx.strokeStyle=(i%2?th.accent:th.accent2);
        ctx.globalAlpha=.12*e;
        ctx.lineWidth=2+(1-e)*5;
        ctx.beginPath(); ctx.moveTo(W*.65+Math.cos(a)*20,H*.38+Math.sin(a)*20); ctx.lineTo(W*.65+Math.cos(a)*len,H*.38+Math.sin(a)*len); ctx.stroke();
    }
    // Shockwave
    ctx.globalAlpha=.28*e;
    ctx.strokeStyle=th.accent; ctx.lineWidth=5*(1-p)+1;
    ctx.beginPath(); ctx.arc(W*villain.x,H*villain.y,20+p*Math.min(W,H)*.28,0,Math.PI*2);ctx.stroke();
    // Screen flash at the beginning
    if(p<.16){ctx.fillStyle=th.accent;ctx.globalAlpha=(.16-p)*2;ctx.fillRect(0,0,W,H)}
    ctx.restore();
}

function drawThemeParticles(t){
    const th=villainTheme[selectedVillain]||villainTheme.goblin;
    ctx.save();
    if(selectedVillain==='electro'){
        ctx.strokeStyle=th.accent; ctx.globalAlpha=.24; ctx.lineWidth=1;
        for(let i=0;i<7;i++){
            const x=(i*173+t*.10)%W, y=(i*97+t*.16)%H;
            ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(t*.003+i)*18,y+55);ctx.stroke();
        }
    }else if(selectedVillain==='goblin'){
        ctx.fillStyle=th.accent2; ctx.globalAlpha=.16;
        for(let i=0;i<18;i++){const x=(i*97+t*.018)%W,y=(i*61+t*.026)%H;ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill()}
    }else if(selectedVillain==='octopus'){
        ctx.strokeStyle=th.accent;ctx.globalAlpha=.13;ctx.lineWidth=4;
        for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W*.5,H*.74,i*55+100+Math.sin(t*.001+i)*10,Math.PI,Math.PI*2);ctx.stroke()}
    }else{
        ctx.strokeStyle=th.accent;ctx.globalAlpha=.16;ctx.lineWidth=3;
        for(let i=0;i<9;i++){const x=(i*145)%W;ctx.beginPath();ctx.moveTo(x,H*.65);ctx.quadraticCurveTo(x+30,H*.52,x+Math.sin(t*.001+i)*50,H*.35);ctx.stroke()}
    }
    ctx.restore();
}



// ============================================================
// CAMERA
// ============================================================

let cameraX = 0;
let cameraY = 0;

let cameraTargetX = 0;
let cameraTargetY = 0;


// ============================================================
// PLAYER HAND
// ============================================================

let handX = .83;
let handY = .92;


// ============================================================
// OBJECTS
// ============================================================

const objects = [

    {
        type:"chair",
        x:.18,
        y:.67,
        depth:.85,
        visible:true,
        respawnAt:0,
        hitFlash:0
    },

    {
        type:"box",
        x:.38,
        y:.73,
        depth:.72,
        visible:true,
        respawnAt:0,
        hitFlash:0
    },

    {
        type:"lamp",
        x:.72,
        y:.56,
        depth:.90,
        visible:true,
        respawnAt:0,
        hitFlash:0
    },

    {
        type:"plant",
        x:.88,
        y:.66,
        depth:.78,
        visible:true,
        respawnAt:0,
        hitFlash:0
    }

];


// ============================================================
// VILLAIN
// ============================================================

let villain = {

    x:.67,
    y:.40,

    targetX:.67,
    targetY:.40

};


// ============================================================
// WEB
// ============================================================

let web = {

    state:"idle",

    startX:0,
    startY:0,

    targetX:0,
    targetY:0,

    progress:0,

    attachedObject:null,

    missTimer:0,

    created:0,

    impact:0

};


// ============================================================
// PARTICLES
// ============================================================

let particles = [];


// ============================================================
// MENU
// ============================================================

function selectVillain(v) {
    selectedVillain = v;
    startGame(v);
}


// ============================================================
// START
// ============================================================

function startGame(villainName) {

    selectedVillain = villainName || selectedVillain;
    gameRunning = true;

    initAudio();
    score = 0;

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "score"
    ).innerText =
    "WEBS: 0";

    document.getElementById(
        "status"
    ).innerText =
    "READY";

    resetObjects();

    resetVillain();

    web.state = "idle";

    particles = [];
    dodgeFX=0; dodgeFlash=0;

    connectWebSocket();

}


// ============================================================
// RESET OBJECTS
// ============================================================

function resetObjects() {

    objects.forEach(
        o => {

            o.visible = true;

            o.respawnAt = 0;

            o.hitFlash = 0;

        }
    );

}


// ============================================================
// RESET VILLAIN
// ============================================================

function resetVillain() {

    villain.x=.67;
    villain.y=.40;

    villain.targetX=.67;
    villain.targetY=.40;

}


// ============================================================
// WEBSOCKET
// ============================================================

function connectWebSocket() {

    try {

        ws = new WebSocket(
            "ws://192.168.4.1:81/"
        );


        ws.onopen =
        function() {

            document.getElementById(
                "status"
            ).innerText =
            "CONNECTED";

        };


        ws.onmessage =
        function(event) {

            if (
                event.data === "FLICK"
            ) {

                shootWeb();

            }

            if (
                event.data === "PULL"
            ) {

                pullObject();

            }

        };


        ws.onclose =
        function() {

            document.getElementById(
                "status"
            ).innerText =
            "SENSOR DISCONNECTED";

        };

    }

    catch(e) {

        console.log(e);

    }

}


// ============================================================
// KEYBOARD
// ============================================================

document.addEventListener(
    "keydown",
    function(e) {

        if (!gameRunning)
            return;


        if (
            e.code === "Space"
        ) {

            e.preventDefault();

            shootWeb();

        }


        if (
            e.key.toLowerCase()
            === "p"
        ) {

            pullObject();

        }


        if (
            e.key.toLowerCase()
            === "q"
        ) {

            quitGame();

        }

    }
);


// ============================================================
// MOUSE TEST
// ============================================================

canvas.addEventListener(
    "click",
    function() {

        if (gameRunning)
            shootWeb();

    }
);


// ============================================================
// SHOOT WEB
// ============================================================

function shootWeb() {

    initAudio();
    webShotSound();

    if (!gameRunning)
        return;


    if (
        web.state !== "idle"
    )
        return;


    score++;


    document.getElementById(
        "score"
    ).innerText =
    "WEBS: " + score;


    web.startX =
    W * handX;

    web.startY =
    H * handY;

    web.progress = 0;

    web.created =
    performance.now();

    web.impact = 0;

    web.attachedObject = null;


    // --------------------------------------------------------
    // TARGET AREA
    // --------------------------------------------------------

    let tx =
    W *
    (
        .38 +
        Math.random() * .42
    );


    let ty =
    H *
    (
        .30 +
        Math.random() * .40
    );


    // --------------------------------------------------------
    // COLLISION
    // --------------------------------------------------------

    let hit =
    findObjectOnPath(
        web.startX,
        web.startY,
        tx,
        ty
    );


    if (hit) {

        web.attachedObject = hit;

        web.targetX =
        W * hit.x;

        web.targetY =
        H * hit.y;

    }

    else {

        web.targetX = tx;

        web.targetY = ty;

    }


    web.state =
    "shooting";


    document.getElementById(
        "status"
    ).innerText =
    "WEB FIRED";


    // --------------------------------------------------------
    // VILLAIN DODGES
    // --------------------------------------------------------

    dodgeVillain();

}


// ============================================================
// FIND OBJECT ON PATH
// ============================================================

function findObjectOnPath(
    x1,
    y1,
    x2,
    y2
) {

    let closest = null;

    let closestDistance =
    Infinity;


    objects.forEach(
        o => {

            if (!o.visible)
                return;


            let ox =
            W * o.x;

            let oy =
            H * o.y;


            let distance =
            distanceToSegment(
                ox,
                oy,
                x1,
                y1,
                x2,
                y2
            );


            let radius =
            65 +
            o.depth * 40;


            if (
                distance <
                radius
            ) {

                let fromStart =
                Math.hypot(
                    ox-x1,
                    oy-y1
                );


                if (
                    fromStart <
                    closestDistance
                ) {

                    closestDistance =
                    fromStart;

                    closest = o;

                }

            }

        }
    );


    return closest;

}


// ============================================================
// DISTANCE
// ============================================================

function distanceToSegment(
    px,
    py,
    x1,
    y1,
    x2,
    y2
) {

    let dx =
    x2-x1;

    let dy =
    y2-y1;


    let lenSq =
    dx*dx +
    dy*dy;


    if (lenSq === 0)
        return Math.hypot(
            px-x1,
            py-y1
        );


    let t =
    (
        (px-x1)*dx +
        (py-y1)*dy
    )
    /
    lenSq;


    t =
    Math.max(
        0,
        Math.min(1,t)
    );


    let nx =
    x1 + t*dx;

    let ny =
    y1 + t*dy;


    return Math.hypot(
        px-nx,
        py-ny
    );

}

function dodgeVillain() {
    const positions = [[.50,.34],[.72,.31],[.57,.46],[.79,.46],[.46,.42],[.68,.28],[.82,.34],[.42,.30]];
    const p=positions[Math.floor(Math.random()*positions.length)];
    villain.targetX=p[0]; villain.targetY=p[1];
    dodgeFX=1; dodgeFlash=1; dodgeStart=performance.now(); dodgeCount++;
    // Strong camera kick makes every dodge feel physical.
    cameraX += (Math.random()-.5)*18;
    cameraY += (Math.random()-.5)*12;
    villainDodgeSound();

    showMessage(th.msg,1000);
    document.getElementById('status').innerText='DODGED!';
}

// PULL
// ============================================================

function pullObject() {

    if (!gameRunning)
        return;


    if (
        web.state !==
        "attached"
    )
        return;


    if (
        !web.attachedObject
    )
        return;


    document.getElementById(
        "status"
    ).innerText =
    "PULLING";


    web.state =
    "retracting";

}

) {

    // VILLAIN-SPECIFIC ENVIRONMENT

            for(let a=0;a<Math.PI*5;a+=.12){
                const rr=18+a*2.3;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.22);
            }

    if(v==='goblin'){
        // Oscorp rooftops + pumpkin bomb glows + glider trails
        ctx.strokeStyle='rgba(180,0,255,.23)';ctx.lineWidth=3;
        for(let i=0;i<5;i++){
            const y=H*(.22+i*.09);
            ctx.beginPath();ctx.moveTo(0,y);ctx.quadraticCurveTo(W*.5,y+30,W,y-20);ctx.stroke();
        }
        for(let i=0;i<9;i++){
            const x=(i*173+t*.035)%W, y=H*(.18+(i%5)*.10);
            ctx.fillStyle='rgba(130,255,50,.18)';ctx.shadowBlur=18;ctx.shadowColor='#79ff30';

        // Green glider-like sweeping trails
        ctx.strokeStyle='rgba(110,255,75,.28)';ctx.lineWidth=5;
        for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-30,H*(.25+i*.16));ctx.bezierCurveTo(W*.3,H*.08+i*20,W*.65,H*.50,W+30,H*(.25+i*.12));ctx.stroke()}
    }

    if(v==='octopus'){
        // Mechanical arms / laboratory reactor
        for(let a=0;a<5;a++){
            const baseX=W*(.48+(a-2)*.06), sway=Math.sin(t*.002+a)*.04;
            ctx.strokeStyle=a%2?'rgba(210,65,75,.42)':'rgba(235,80,255,.28)';ctx.lineWidth=12;
            ctx.beginPath();ctx.moveTo(baseX,H*.82);
            ctx.bezierCurveTo(W*(.15+a*.20),H*(.70+sway),W*(.10+a*.23),H*(.35-sway),W*(.25+a*.18),H*.13);
            ctx.stroke();

        // Reactor bars
        ctx.fillStyle='rgba(255,30,60,.12)';ctx.fillRect(W*.43,H*.20,W*.14,H*.40);

    }

    if(v==='lizard'){
        // Sewer pipes and vines
        ctx.strokeStyle='rgba(100,220,130,.26)';ctx.lineWidth=12;
        for(let i=0;i<6;i++){
            const x=W*(.05+i*.19);

        for(let i=0;i<12;i++){

            ctx.beginPath();ctx.moveTo(x,H);ctx.bezierCurveTo(x-80,H*.78,x+70,H*.60,x-20,H*.30);ctx.stroke();
        }
        // Sewer water ripples
        ctx.strokeStyle='rgba(120,220,190,.18)';ctx.lineWidth=2;
        for(let i=0;i<7;i++){const yy=horizon+35+i*38;ctx.beginPath();ctx.ellipse(W*.5,yy,W*(.12+i*.06),10+i*2,0,0,Math.PI*2);ctx.stroke()}
    }
    ctx.restore();

    // ------------------------------------------------------------
    // GROUND / REFLECTIONS
    // ------------------------------------------------------------
    ctx.fillStyle=v==='electro'?'#03101a':v==='goblin'?'#090c0a':v==='octopus'?'#0c070c':'#06100b';
    ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W,horizon);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

    for(let i=1;i<8;i++){const q=i/8,yy=horizon+Math.pow(q,1.8)*(H-horizon);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}

    // Colored moving reflections
    ctx.save();ctx.globalAlpha=.10;
    for(let i=0;i<12;i++){

    for(let i=0;i<55;i++){

// ============================================================
// DRAW OBJECTS
// ============================================================

function drawObjects() {

    objects.forEach(
        o => {

            if (!o.visible)
                return;


            let x =
            W*o.x;

            let y =
            H*o.y;


            let scale =
            .62 +
            o.depth*.60;


            ctx.save();


            ctx.translate(
                x,
                y
            );


            ctx.scale(
                scale,
                scale
            );


            if (
                o.type === "chair"
            )
                drawChair();


            if (
                o.type === "box"
            )
                drawBox();


            if (
                o.type === "lamp"
            )
                drawLamp();


            if (
                o.type === "plant"
            )
                drawPlant();


            // hit glow

            if (
                o.hitFlash >
                performance.now()
            ) {

                ctx.strokeStyle =
                "white";

                ctx.lineWidth=4;

                ctx.beginPath();

                ctx.arc(
                    0,
                    0,
                    80,
                    0,
                    Math.PI*2
                );

                ctx.stroke();

            }


            ctx.restore();

        }
    );

}

            leaf;


            ctx.beginPath();

            ctx.ellipse(
                0,
                0,
                28,
                11,
                0,
                0,
                Math.PI*2
            );

            ctx.fill();


            ctx.restore();

        }
    );

}


// ============================================================
// VILLAIN
// ============================================================

function drawVillain() {
    const now=performance.now();
    villain.x+=(villain.targetX-villain.x)*.075;
    villain.y+=(villain.targetY-villain.y)*.075;
    const x=W*villain.x, y=H*villain.y;
    const th=villainTheme[selectedVillain]||villainTheme.goblin;
    const bob=Math.sin(now*.004)*5;
    const data=villainImages[selectedVillain];

    // Trail during dodge.
    if(dodgeFX>0){
        const p=Math.min(1,(now-dodgeStart)/900);
        ctx.save();ctx.globalAlpha=.22*(1-p);
        for(let i=1;i<5;i++){
            const tx=x-(villain.targetX-.67)*W*.25*i;
            const ty=y-(villain.targetY-.40)*H*.25*i;
            ctx.translate(tx-x,ty-y);ctx.globalAlpha*=.72;drawVillainImage(data,0,0,th,1-p);ctx.setTransform(1,0,0,1,tx,ty);
        }
        ctx.restore();
    }
    ctx.save();
    ctx.translate(x,y+bob);
    drawVillainImage(data,0,0,th,1);
    ctx.restore();
    if(dodgeFX>0 && now-dodgeStart>900)dodgeFX=0;
}

function drawVillainImage(data,x,y,th,alpha){
    ctx.save();ctx.globalAlpha=alpha;
    // Ground shadow
    ctx.fillStyle='rgba(0,0,0,.48)';ctx.beginPath();ctx.ellipse(x,y+H*.10,55,13,0,0,Math.PI*2);ctx.fill();
    if(data && data.canvas){
        const c=data.canvas;
        const maxH=Math.min(H*.52,390);
        const scale=(selectedVillain==='lizard'?.82:selectedVillain==='goblin'?.78:selectedVillain==='octopus'?.84:.88);
        const dh=maxH*scale, dw=dh*(c.width/c.height);
        ctx.shadowBlur=selectedVillain==='electro'?34:22;ctx.shadowColor=th.accent;
        ctx.drawImage(c,-dw/2,-dh*.62,dw,dh);
        ctx.shadowBlur=0;
    }else{
        // fallback silhouette while image loads
        ctx.fillStyle=th.accent;ctx.beginPath();ctx.ellipse(0,0,48,70,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-16,-32,8,0,Math.PI*2);ctx.arc(16,-32,8,0,Math.PI*2);ctx.fill();
    }
    // Comic aura / rim.
    ctx.globalAlpha=.22*alpha;ctx.strokeStyle=th.accent;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,75+Math.sin(performance.now()*.006)*7,0,Math.PI*2);ctx.stroke();
    ctx.restore();
}

// ============================================================
// PLAYER HAND
// ============================================================

function drawHand() {

    let x =
    W*handX;

    let y =
    H*handY;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    // arm

    let arm =
    ctx.createLinearGradient(
        -40,
        0,
        40,
        180
    );


    arm.addColorStop(
        0,
        "#182243"
    );

    arm.addColorStop(
        1,
        "#060913"
    );


    ctx.fillStyle =
    arm;


    ctx.beginPath();

    ctx.moveTo(
        -38,
        0
    );

    ctx.lineTo(
        38,
        0
    );

    ctx.lineTo(
        72,
        180
    );

    ctx.lineTo(
        -82,
        180
    );

    ctx.closePath();

    ctx.fill();


    // glove

    ctx.fillStyle =
    "#141b38";


    ctx.beginPath();

    ctx.ellipse(
        0,
        -7,
        50,
        44,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    // fingers

    for (
        let i=0;
        i<3;
        i++
    ) {

        ctx.beginPath();

        ctx.roundRect(
            -43+i*29,
            -55,
            22,
            55,
            10
        );

        ctx.fill();

    }


    // spider design

    ctx.strokeStyle =
    "#e0e0e0";

    ctx.lineWidth=3;


    ctx.beginPath();

    ctx.moveTo(
        0,
        -28
    );

    ctx.lineTo(
        0,
        18
    );

    ctx.moveTo(
        -20,
        -10
    );

    ctx.lineTo(
        20,
        -10
    );

    ctx.moveTo(
        -16,
        5
    );

    ctx.lineTo(
        16,
        5
    );

    ctx.stroke();


    ctx.restore();

}


// ============================================================
// CROSSHAIR
// ============================================================

function drawCrosshair() {

    let x =
    W/2;

    let y =
    H/2;


    ctx.save();


    ctx.strokeStyle =
    "rgba(255,255,255,.65)";

    ctx.lineWidth=2;


    ctx.beginPath();

    ctx.moveTo(
        x-18,
        y
    );

    ctx.lineTo(
        x-5,
        y
    );

    ctx.moveTo(
        x+5,
        y
    );

    ctx.lineTo(
        x+18,
        y
    );

    ctx.moveTo(
        x,
        y-18
    );

    ctx.lineTo(
        x,
        y-5
    );

    ctx.moveTo(
        x,
        y+5
    );

    ctx.lineTo(
        x,
        y+18
    );

    ctx.stroke();


    ctx.fillStyle =
    "white";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


// ============================================================
// REAL WEB
// ============================================================

function drawWeb() {

    if (
        web.state ===
        "idle"
    )
        return;


    let sx =
    web.startX;

    let sy =
    web.startY;


    let ex =
    web.targetX;

    let ey =
    web.targetY;


    let p =
    web.progress;


    let cx =
    sx +
    (ex-sx)*p;

    let cy =
    sy +
    (ey-sy)*p;


    let dx =
    cx-sx;

    let dy =
    cy-sy;


    let length =
    Math.hypot(
        dx,
        dy
    );


    if (length < 2)
        return;


    let angle =
    Math.atan2(
        dy,
        dx
    );


    let nx =
    -Math.sin(angle);

    let ny =
    Math.cos(angle);


    ctx.save();


    // ========================================================
    // WEB GLOW
    // ========================================================

    ctx.shadowColor =
    "rgba(255,255,255,.9)";

    ctx.shadowBlur=15;


    // ========================================================
    // MAIN STRANDS
    // ========================================================

    const strandCount = 9;


    for (
        let s=0;
        s<strandCount;
        s++
    ) {

        let offset =
        (
            s -
            (strandCount-1)/2
        )*2.2;


        ctx.beginPath();


        let steps =
        Math.max(
            12,
            Math.floor(
                length/14
            )
        );


        for (
            let i=0;
            i<=steps;
            i++
        ) {

            let t =
            i/steps;


            let px =
            sx +
            dx*t;

            let py =
            sy +
            dy*t;


            // flowing movement

            let wave =
            Math.sin(
                t*Math.PI*9 +
                performance.now()*.012 +
                s*.7
            )
            *
            4
            *
            Math.sin(
                t*Math.PI
            );


            px +=
            nx*
            (
                offset+
                wave
            );


            py +=
            ny*
            (
                offset+
                wave
            );


            if (i===0)
                ctx.moveTo(
                    px,
                    py
                );

            else
                ctx.lineTo(
                    px,
                    py
                );

        }


        ctx.strokeStyle =
        s===4
        ?
        "white"
        :
        "rgba(235,235,235,.52)";


        ctx.lineWidth =
        s===4
        ? 3
        : 1;


        ctx.stroke();

    }


    // ========================================================
    // DIAGONAL WEAVING
    // ========================================================

    let rings =
    Math.max(
        3,
        Math.floor(
            length/42
        )
    );


    for (
        let r=1;
        r<=rings;
        r++
    ) {

        let t =
        r/(rings+1);


        let px =
        sx+
        dx*t;

        let py =
        sy+
        dy*t;


        let width =
        8+
        t*28;


        let curve =
        Math.sin(
            performance.now()*.007+
            r
        )*6;


        px +=
        Math.cos(angle)*
        curve;


        py +=
        Math.sin(angle)*
        curve;


        let lx =
        px-
        nx*width;

        let ly =
        py-
        ny*width;


        let rx =
        px+
        nx*width;

        let ry =
        py+
        ny*width;


        ctx.beginPath();


        ctx.moveTo(
            lx,
            ly
        );


        ctx.quadraticCurveTo(
            px+
            Math.cos(angle)*
            curve,

            py+
            Math.sin(angle)*
            curve,

            rx,
            ry
        );


        ctx.strokeStyle =
        "rgba(255,255,255,.72)";

        ctx.lineWidth=1.4;

        ctx.stroke();

    }


    ctx.restore();


    // ========================================================
    // OBJECT WRAP
    // ========================================================

    if (
        web.state ===
        "attached" &&
        web.attachedObject
    ) {

        drawWrappedWeb(
            cx,
            cy,
            web.attachedObject
        );

    }


    // ========================================================
    // TIP
    // ========================================================

    ctx.save();


    ctx.shadowColor =
    "white";

    ctx.shadowBlur=20;


    ctx.fillStyle =
    "white";


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();


    // particles

    drawParticles();

}


// ============================================================
// WRAPPED WEB AROUND OBJECT
// ============================================================

function drawWrappedWeb(
    x,
    y,
    object
) {

    let time =
    performance.now();


    ctx.save();


    ctx.translate(
        x,
        y
    );


    // size based on object

    let size =
    48 +
    object.depth*20;


    // ========================================================
    // RADIAL WEB STRANDS
    // ========================================================

    for (
        let i=0;
        i<14;
        i++
    ) {

        let a =
        i *
        Math.PI*2/14;


        let wobble =
        Math.sin(
            time*.008+i
        )*3;


        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );


        ctx.lineTo(
            Math.cos(a)*
            (size+wobble),

            Math.sin(a)*
            (size+wobble)
        );


        ctx.strokeStyle =
        "rgba(255,255,255,.82)";

        ctx.lineWidth=1.5;

        ctx.stroke();

    }


    // ========================================================
    // CONCENTRIC WEB RINGS
    // ========================================================

    for (
        let r=10;
        r<size;
        r+=10
    ) {

        ctx.beginPath();


        // slightly irregular web ring

        for (
            let i=0;
            i<=36;
            i++
        ) {

            let a =
            i*Math.PI*2/36;


            let irregular =
            Math.sin(
                a*5+
                time*.006
            )*2;


            let rr =
            r+
            irregular;


            let px =
            Math.cos(a)*rr;

            let py =
            Math.sin(a)*rr;


            if (i===0)
                ctx.moveTo(
                    px,
                    py
                );

            else
                ctx.lineTo(
                    px,
                    py
                );

        }


        ctx.strokeStyle =
        "rgba(255,255,255,.68)";

        ctx.lineWidth=1.3;

        ctx.stroke();

    }


    // ========================================================
    // EXTRA STRANDS WRAPPING AROUND OBJECT
    // ========================================================

    for (
        let i=0;
        i<5;
        i++
    ) {

        ctx.beginPath();


        for (
            let j=0;
            j<=20;
            j++
        ) {

            let t =
            j/20;


            let a =
            t*Math.PI*2 +
            i*.45;


            let radius =
            size*.65 +
            Math.sin(
                t*Math.PI*4+
                i
            )*5;


            let px =
            Math.cos(a)*radius;

            let py =
            Math.sin(a)*radius;


            if (j===0)
                ctx.moveTo(
                    px,
                    py
                );

            else
                ctx.lineTo(
                    px,
                    py
                );

        }


        ctx.strokeStyle =
        "rgba(255,255,255,.55)";

        ctx.lineWidth=1.2;

        ctx.stroke();

    }


    ctx.restore();

}


// ============================================================
// PARTICLES
// ============================================================

function createParticles(
    x,
    y
) {

    for (
        let i=0;
        i<24;
        i++
    ) {

        let a =
        Math.random()*
        Math.PI*2;


        let speed =
        1+
        Math.random()*5;


        particles.push({

            x:x,

            y:y,

            vx:
            Math.cos(a)*
            speed,

            vy:
            Math.sin(a)*
            speed,

            life:1

        });

    }

}


// ============================================================
// DRAW PARTICLES
// ============================================================

function drawParticles() {

    for (
        let i=
        particles.length-1;
        i>=0;
        i--
    ) {

        let p =
        particles[i];


        p.x +=
        p.vx;

        p.y +=
        p.vy;


        p.vx *= .96;

        p.vy *= .96;


        p.life -= .035;


        if (
            p.life<=0
        ) {

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();


        ctx.globalAlpha =
        p.life;


        ctx.fillStyle =
        "white";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.restore();

    }

}


// ============================================================
// UPDATE WEB
// ============================================================

function updateWeb() {

    if (
        web.state ===
        "idle"
    )
        return;


    // ========================================================
    // SHOOT
    // ========================================================

    if (
        web.state ===
        "shooting"
    ) {

        web.progress += .09;


        if (
            Math.random()<.35
        ) {

            let px =
            web.startX+
            (
                web.targetX-
                web.startX
            )*
            web.progress;


            let py =
            web.startY+
            (
                web.targetY-
                web.startY
            )*
            web.progress;


            particles.push({

                x:px,

                y:py,

                vx:
                (Math.random()-.5)*1.5,

                vy:
                (Math.random()-.5)*1.5,

                life:.45

            });

        }


        if (
            web.progress>=1
        ) {

            web.progress=1;


            if (
                web.attachedObject
            ) {

                web.state =
                "attached";


                web.impact =
                performance.now();


                web.attachedObject.hitFlash =
                performance.now()+250;


                createParticles(
                    web.targetX,
                    web.targetY
                );


                document.getElementById(
                    "status"
                ).innerText =
                "WEB ATTACHED";


            }

            else {

                web.state =
                "missPause";


                web.missTimer =
                performance.now();


                createParticles(
                    web.targetX,
                    web.targetY
                );


                document.getElementById(
                    "status"
                ).innerText =
                "MISSED";

            }

        }

    }


    // ========================================================
    // MISSED
    // ========================================================

    else if (
        web.state ===
        "missPause"
    ) {

        if (
            performance.now()-
            web.missTimer >
            180
        ) {

            web.state =
            "retracting";

        }

    }


    // ========================================================
    // RETRACT
    // ========================================================

    else if (
        web.state ===
        "retracting"
    ) {

        web.progress -= .095;


        // ----------------------------------------------------
        // OBJECT MOVES TOWARD HAND
        // ----------------------------------------------------

        if (
            web.attachedObject
        ) {

            let o =
            web.attachedObject;


            o.x +=
            (
                handX-o.x
            )*.14;


            o.y +=
            (
                handY-o.y
            )*.14;


            // remove object

            if (
                web.progress <
                .35
            ) {

                o.visible=false;


                // respawn later

                o.respawnAt =
                performance.now()
                +
                1200;

            }

        }


        if (
            web.progress<=0
        ) {

            web.progress=0;

            web.state="idle";

            web.attachedObject=null;


            document.getElementById(
                "status"
            ).innerText =
            "READY";

        }

    }

}


// ============================================================
// RESPAWN
// ============================================================

function updateRespawns() {

    let now =
    performance.now();


    objects.forEach(
        o => {

            if (
                !o.visible &&
                o.respawnAt>0 &&
                now>=o.respawnAt
            ) {

                respawnObject(o);

            }

        }
    );

}


// ============================================================
// RESPAWN POSITION
// ============================================================

function respawnObject(o) {

    let x;
    let y;

    let tries=0;


    do {

        x =
        .10+
        Math.random()*.80;


        y =
        .52+
        Math.random()*.22;


        tries++;

    }
    while (
        tooClose(
            x,
            y,
            o
        ) &&
        tries<30
    );


    o.x=x;

    o.y=y;


    o.depth =
    .65+
    Math.random()*.32;


    o.visible=true;

    o.respawnAt=0;

}


// ============================================================
// CHECK POSITION
// ============================================================

function tooClose(
    x,
    y,
    current
) {

    for (
        let o of objects
    ) {

        if (
            o===current ||
            !o.visible
        )
            continue;


        let dx =
        W*x-
        W*o.x;


        let dy =
        H*y-
        H*o.y;


        if (
            Math.hypot(
                dx,
                dy
            )<110
        )
            return true;

    }


    return false;

}


// ============================================================
// CAMERA
// ============================================================

function updateCamera() {

    let now =
    performance.now();


    cameraTargetX =
    Math.sin(
        now*.0008
    )*3;


    cameraTargetY =
    Math.cos(
        now*.001
    )*2;


    cameraX +=
    (
        cameraTargetX-
        cameraX
    )*.03;


    cameraY +=
    (
        cameraTargetY-
        cameraY
    )*.03;

}


// ============================================================
// GAME LOOP
// ============================================================

function gameLoop() {

    requestAnimationFrame(
        gameLoop
    );


    if (!gameRunning)
        return;


    updateCamera();

    updateWeb();

    updateRespawns();


    ctx.save();


    ctx.translate(
        cameraX,
        cameraY
    );


    drawBackground();

    drawObjects();

    drawVillain();

    drawWeb();

    drawHand();


    ctx.restore();


    drawCrosshair();

}


gameLoop();


// ============================================================
// QUIT
// ============================================================

function quitGame() {

    gameRunning=false;


    if (ws) {

        try {

            ws.close();

        }

        catch(e) {}

    }


    const menu=document.getElementById("menu");
    menu.innerHTML=`
        <div class="title">CATCH THE USELESS VILLAIN</div>

        <button class="menuButton green" onclick="selectVillain('goblin')">GREEN GOBLIN</button>
        <button class="menuButton yellow" onclick="selectVillain('electro')">ELECTRO</button>
        <button class="menuButton red" onclick="selectVillain('octopus')">DOCTOR OCTOPUS</button>
        <button class="menuButton blue" onclick="selectVillain('lizard')">LIZARD</button>`;
    menu.style.display="flex";


    document.getElementById(
        "menu"
    ).innerHTML = `

        <div class="title">
            CATCH THE USELESS VILLAIN
        </div>

        <div class="subtitle">
            SELECT YOUR VILLIAN
        </div>

        <button class="menuButton green"
        onclick="selectVillain('goblin')">
            GREEN GOBLIN
        </button>

        <button class="menuButton yellow"
        onclick="selectVillain('electro')">
            ELECTRO
        </button>

        <button class="menuButton red"
        onclick="selectVillain('octopus')">
            DOCTOR OCTOPUS
        </button>

        <button class="menuButton blue"
        onclick="selectVillain('lizard')">

        </button>

    `;

}
